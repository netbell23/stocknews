<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>StoryMate</title>
<script>
  // GitHub Pages 는 없는 경로에 이 파일(사이트 루트 404.html)을 서빙한다.
  // StoryMate 는 SPA 라 /stocknews/storymate/home 같은 하위 경로가 실제 파일로 없으므로,
  // 여기서 원래 경로를 sessionStorage 에 담아두고 앱 index 로 보낸 뒤,
  // index.html 의 복원 스니펫이 주소창을 되살려 올바른 화면으로 라우팅한다.
  (function () {
    var l = window.location;
    var base = '/stocknews/storymate/';
    var i = l.pathname.indexOf(base);
    if (i === 0) {
      var route = l.pathname.slice(base.length) + l.search + l.hash;
      try { sessionStorage.setItem('spa_redirect', route); } catch (e) {}
      l.replace(base);
    } else {
      // StoryMate 외의 없는 경로는 증시 홈으로.
      l.replace('/stocknews/');
    }
  })();
</script>
</head>
<body></body>
</html>
