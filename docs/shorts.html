<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인기 숏츠 모음</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#272b34; --txt:#e6e8eb; --sub:#9aa0ab; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif; }
  header { padding:22px 18px 6px; }
  header h1 { margin:0; font-size:22px; }
  header .ts { color:var(--sub); font-size:13px; margin-top:4px; }
  main { padding:12px 14px 40px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; gap:14px;
          grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          overflow:hidden; text-decoration:none; color:inherit;
          transition:transform .12s ease, border-color .12s ease; }
  .card:hover { transform:translateY(-3px); border-color:#3a4150; }
  .thumb { position:relative; aspect-ratio:9/16; background:#000; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .noimg { display:flex; align-items:center; justify-content:center;
                  height:100%; font-size:34px; color:#444; }
  .badge { position:absolute; top:8px; left:8px; color:#000; font-weight:700;
           font-size:11px; padding:2px 7px; border-radius:20px; }
  .views { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,.65);
           color:#fff; font-size:12px; padding:2px 7px; border-radius:20px; }
  .meta { padding:10px 11px 12px; }
  .title { font-size:13px; font-weight:600; line-height:1.35;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
           overflow:hidden; }
  .author { font-size:12px; color:var(--sub); margin-top:5px; }
  .empty { color:var(--sub); text-align:center; padding:60px 20px; }
  footer { text-align:center; color:var(--sub); font-size:12px; padding:20px; }
</style>
</head>
<body>
  <header>
    <h1>🔥 인기 숏츠 모음</h1>
    <div class="ts">2026-06-03 10:17 기준 · 조회수 순</div>
  </header>
  <main>
    <p class="empty">아직 수집된 숏츠가 없습니다. YOUTUBE_API_KEY 등 설정을 확인하세요.</p>
  </main>
  <footer>매일 자동 업데이트 · 각 영상의 저작권은 원작자에게 있습니다</footer>
</body>
</html>
