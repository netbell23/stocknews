<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 관리</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#272b34; --txt:#e6e8eb; --sub:#9aa0ab; --accent:#4dabf7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif; }
  header { padding:22px 18px 6px; }
  header h1 { margin:0; font-size:22px; }
  header .ts { color:var(--sub); font-size:13px; margin-top:4px; }
  header a.back { display:inline-block; margin-top:10px; color:var(--accent); text-decoration:none; font-size:13px; }
  main { padding:8px 14px 40px; max-width:820px; margin:0 auto; }
  section.grp { margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  h2 { font-size:16px; margin:0 0 4px; }
  .hint { color:var(--sub); font-size:12px; margin:0 0 12px; line-height:1.5; }
  .item { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #20242c; }
  .item:last-of-type { border-bottom:0; }
  .item .nm { flex:1; font-weight:600; font-size:14px; }
  .item .tk { color:var(--sub); font-size:12px; font-family:monospace; min-width:90px; }
  .item button { background:#2a1215; color:#ff6b6b; border:1px solid #52262b; border-radius:7px;
                 padding:4px 9px; cursor:pointer; font-size:12px; }
  .item button:hover { background:#3a181d; }
  .addrow { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .addrow input { background:#11151b; border:1px solid var(--line); border-radius:8px;
                  color:var(--txt); padding:8px 10px; font-size:13px; }
  .addrow .in-name { flex:2; min-width:130px; }
  .addrow .in-tk { flex:1; min-width:100px; font-family:monospace; }
  .addrow button { background:#12341f; color:#69db7c; border:1px solid #235; border-radius:8px;
                   padding:8px 14px; cursor:pointer; font-size:13px; font-weight:600; }
  .addrow button:hover { background:#173f27; }
  .save { margin-top:22px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .save input { width:100%; background:#11151b; border:1px solid var(--line); border-radius:8px;
                color:var(--txt); padding:9px 11px; font-size:13px; font-family:monospace; margin:6px 0 4px; }
  .save .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .btn { border:none; border-radius:9px; padding:10px 16px; cursor:pointer; font-size:14px; font-weight:600; }
  .btn-primary { background:var(--accent); color:#08131f; }
  .btn-ghost { background:#1f2630; color:var(--txt); border:1px solid var(--line); }
  .status { margin-top:10px; font-size:13px; min-height:18px; }
  .ok { color:#69db7c; } .err { color:#ff6b6b; }
  details { margin-top:8px; color:var(--sub); font-size:12px; }
  summary { cursor:pointer; }
  code { background:#11151b; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
  <header>
    <h1>🛠️ 종목 관리</h1>
    <div class="ts">카테고리별로 종목/지수를 추가·삭제하고 저장하세요. 저장하면 다음 갱신부터 반영됩니다.</div>
    <a class="back" href="index.html">← 시황으로 돌아가기</a>
  </header>
  <main id="main">불러오는 중…</main>

  <script>
  const REPO = "netbell23/stocknews";
  const FILE = "docs/watchlist.json";

  // 카테고리별 추천 종목(검색용): 이름 → 티커
  const PRESETS = {
    "지수": {"코스피":"^KS11","코스닥":"^KQ11","S&P500":"^GSPC","나스닥":"^IXIC","나스닥100":"^NDX",
      "다우존스":"^DJI","닛케이225":"^N225","상해종합":"000001.SS","항셍":"^HSI",
      "유로스톡스50":"^STOXX50E","독일DAX":"^GDAXI","대만가권":"^TWII"},
    "환율": {"미국 USD":"KRW=X","일본 JPY(100엔)":"JPYKRW=X","유럽 EUR":"EURKRW=X","중국 CNY":"CNYKRW=X",
      "영국 GBP":"GBPKRW=X","호주 AUD":"AUDKRW=X","달러인덱스":"DX-Y.NYB","달러/엔":"JPY=X","유로/달러":"EURUSD=X"},
    "원자재": {"WTI 국제유가":"CL=F","브렌트유":"BZ=F","금":"GC=F","은":"SI=F","구리":"HG=F",
      "천연가스":"NG=F","백금":"PL=F","옥수수":"ZC=F"},
    "국내종목": {"삼성전자":"005930.KS","SK하이닉스":"000660.KS","SK스퀘어":"402340.KS","한미반도체":"042700.KS",
      "DB하이텍":"000990.KS","원익IPS":"240810.KS","리노공업":"058470.KS","이오테크닉스":"039030.KS",
      "주성엔지니어링":"036930.KQ","HPSP":"403870.KQ","이수페타시스":"007660.KS",
      "현대차":"005380.KS","기아":"000270.KS","현대모비스":"012330.KS","LG에너지솔루션":"373220.KS",
      "삼성SDI":"006400.KS","LG화학":"051910.KS","POSCO홀딩스":"005490.KS","현대제철":"004020.KS",
      "네이버":"035420.KS","카카오":"035720.KS","삼성바이오로직스":"207940.KS","셀트리온":"068270.KS",
      "KB금융":"105560.KS","신한지주":"055550.KS","삼성물산":"028260.KS","LG전자":"066570.KS",
      "한화에어로스페이스":"012450.KS","HD현대중공업":"329180.KS","두산에너빌리티":"034020.KS",
      "크래프톤":"259960.KS","엔씨소프트":"036570.KS","컴투스":"078340.KQ","하이브":"352820.KS",
      "에코프로비엠":"247540.KQ","에코프로":"086520.KQ","알테오젠":"196170.KQ","리가켐바이오":"141080.KQ"},
    "해외 종목": {"엔비디아":"NVDA","테슬라":"TSLA","알파벳(구글)":"GOOGL","애플":"AAPL","마이크로소프트":"MSFT",
      "아마존":"AMZN","메타":"META","스페이스엑스":"SPCX","TSMC":"TSM","ASML":"ASML","AMD":"AMD",
      "브로드컴":"AVGO","팔란티어":"PLTR","마이크론":"MU"}
  };

  let data = null;

  async function load() {
    try {
      const r = await fetch("watchlist.json?cb=" + Date.now());
      data = await r.json();
      render();
    } catch (e) {
      document.getElementById("main").innerHTML = "<p class='err'>watchlist.json 을 불러오지 못했습니다: " + e + "</p>";
    }
  }

  function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function render() {
    let html = "";
    data.groups.forEach((g, gi) => {
      const presets = PRESETS[g.title] || {};
      const opts = Object.keys(presets).map(n => `<option value="${esc(n)}">${esc(presets[n])}</option>`).join("");
      const items = g.items.map((it, ii) => `
        <div class="item">
          <span class="nm">${g.emoji||""} ${esc(it.name)}</span>
          <span class="tk">${esc(it.ticker)}</span>
          <button onclick="removeItem(${gi},${ii})">삭제</button>
        </div>`).join("");
      html += `
      <section class="grp">
        <h2>${g.emoji||""} ${esc(g.title)} <small style="color:var(--sub);font-weight:400;font-size:12px">${g.items.length}개</small></h2>
        <p class="hint">${esc(g.hint||"")}</p>
        ${items || '<p class="hint">(비어있음)</p>'}
        <div class="addrow">
          <input class="in-name" id="nm${gi}" list="dl${gi}" placeholder="종목명 (검색)" oninput="autofill(${gi})">
          <datalist id="dl${gi}">${opts}</datalist>
          <input class="in-tk" id="tk${gi}" placeholder="티커">
          <button onclick="addItem(${gi})">+ 추가</button>
        </div>
      </section>`;
    });

    html += `
      <div class="save">
        <h2>💾 저장</h2>
        <p class="hint">GitHub 토큰으로 바로 저장하거나(자기 완결), 토큰 없이 설정을 복사해 Claude 에게 주면 반영됩니다.</p>
        <input id="pat" type="password" placeholder="GitHub 토큰 (fine-grained, 이 저장소 Contents:RW) — 브라우저에만 저장됨" >
        <div class="row">
          <button class="btn btn-primary" onclick="saveGithub()">GitHub에 저장</button>
          <button class="btn btn-ghost" onclick="copyJson()">설정 JSON 복사</button>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)">
            <input type="checkbox" id="rebuild" style="width:auto"> 저장 후 즉시 페이지 재생성
          </label>
        </div>
        <div class="status" id="status"></div>
        <details><summary>토큰 발급 방법</summary>
          github.com → Settings → Developer settings → Personal access tokens →
          Fine-grained tokens → 저장소 <code>${REPO}</code> 선택 → Repository permissions의
          <code>Contents: Read and write</code> 부여 → 생성 후 토큰을 위에 붙여넣기.
          토큰은 이 브라우저(localStorage)에만 저장되고 GitHub API 로만 전송됩니다.
        </details>
      </div>`;

    document.getElementById("main").innerHTML = html;
    const pat = localStorage.getItem("gh_pat");
    if (pat) document.getElementById("pat").value = pat;
  }

  function autofill(gi) {
    const nm = document.getElementById("nm"+gi).value.trim();
    const presets = PRESETS[data.groups[gi].title] || {};
    if (presets[nm]) document.getElementById("tk"+gi).value = presets[nm];
  }

  function addItem(gi) {
    const nm = document.getElementById("nm"+gi).value.trim();
    let tk = document.getElementById("tk"+gi).value.trim();
    const presets = PRESETS[data.groups[gi].title] || {};
    if (!tk && presets[nm]) tk = presets[nm];
    if (!nm || !tk) { setStatus("종목명과 티커를 모두 입력하세요.", false); return; }
    if (data.groups[gi].items.some(it => it.ticker === tk)) { setStatus("이미 있는 티커입니다.", false); return; }
    data.groups[gi].items.push({ name: nm, ticker: tk });
    render();
    setStatus(`추가됨: ${nm} (${tk}) — 저장을 눌러야 반영됩니다.`, true);
  }

  function removeItem(gi, ii) {
    data.groups[gi].items.splice(ii, 1);
    render();
    setStatus("삭제됨 — 저장을 눌러야 반영됩니다.", true);
  }

  function jsonText() { return JSON.stringify(data, null, 2) + "\n"; }

  function copyJson() {
    navigator.clipboard.writeText(jsonText())
      .then(() => setStatus("설정 JSON 을 복사했습니다. Claude 에게 붙여넣어 '이걸로 watchlist 업데이트해줘' 라고 하세요.", true))
      .catch(e => setStatus("복사 실패: " + e, false));
  }

  function setStatus(msg, ok) {
    const el = document.getElementById("status");
    if (el) { el.textContent = msg; el.className = "status " + (ok ? "ok" : "err"); }
  }

  async function saveGithub() {
    const pat = document.getElementById("pat").value.trim();
    if (!pat) { setStatus("GitHub 토큰을 입력하세요 (또는 '설정 JSON 복사' 사용).", false); return; }
    localStorage.setItem("gh_pat", pat);
    const H = { "Authorization": "Bearer " + pat, "Accept": "application/vnd.github+json" };
    setStatus("저장 중…", true);
    try {
      // 현재 파일 sha 조회
      const getR = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, { headers: H });
      if (!getR.ok) throw new Error("파일 조회 실패 (" + getR.status + ") — 토큰 권한을 확인하세요.");
      const cur = await getR.json();
      const b64 = btoa(unescape(encodeURIComponent(jsonText())));
      const putR = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
        method: "PUT", headers: H,
        body: JSON.stringify({ message: "watchlist 업데이트 (관리페이지)", content: b64, sha: cur.sha })
      });
      if (!putR.ok) { const e = await putR.json(); throw new Error(e.message || putR.status); }
      let msg = "✓ 저장 완료! 다음 갱신부터 반영됩니다.";
      if (document.getElementById("rebuild").checked) {
        const dR = await fetch(`https://api.github.com/repos/${REPO}/dispatches`, {
          method: "POST", headers: H, body: JSON.stringify({ event_type: "morning-kakao" }) });
        msg += dR.ok ? " 페이지 재생성 요청함(1~2분 뒤 반영)." : " (재생성 요청 실패)";
      }
      setStatus(msg, true);
    } catch (e) {
      setStatus("저장 실패: " + e.message, false);
    }
  }

  load();
  </script>
</body>
</html>
