<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>내 생활 포털</title>
<meta name="description" content="날씨·교통·길찾기·일정·맛집·카페·주차·뉴스·주식·여행 — 매일 쓰는 검색을 한 화면에">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<meta name="theme-color" content="#101418">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1c2430; --sub:#69788c;
  --line:#e3e8ef; --chip:#eef2f7; --chip-text:#41506b; --accent:#2f6fed;
  --shadow:0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101418; --card:#1a2027; --text:#e8edf4; --sub:#8b98a9;
    --line:#242c36; --chip:#232b35; --chip-text:#aebccf; --accent:#5b8dff;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  background:var(--bg); color:var(--text);
  padding:max(env(safe-area-inset-top),14px) 14px calc(env(safe-area-inset-bottom) + 24px);
  max-width:560px; margin:0 auto;
}
a{text-decoration:none;color:inherit}

/* 헤더 */
header{padding:6px 4px 14px}
.date-row{display:flex;align-items:baseline;justify-content:space-between}
#today{font-size:.95rem;color:var(--sub);font-weight:600}
#clock{font-size:.95rem;color:var(--sub);font-variant-numeric:tabular-nums}
#greet{font-size:1.35rem;font-weight:800;margin-top:6px;letter-spacing:-.02em}

/* 검색 */
.search{display:flex;gap:8px;margin:2px 0 18px}
.search input{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:14px;padding:13px 16px;font-size:1rem;outline:none;box-shadow:var(--shadow);
}
.search input:focus{border-color:var(--accent)}
.search button{
  border:none;background:var(--accent);color:#fff;border-radius:14px;
  padding:0 18px;font-size:1rem;font-weight:700;cursor:pointer;
}

/* 메뉴 그리드 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;
}
.card .main{display:flex;align-items:center;gap:10px}
.card .num{
  font-size:.68rem;font-weight:700;color:var(--sub);
  position:absolute;top:10px;right:12px;letter-spacing:.02em;
}
.card{position:relative}
.card .icon{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.card .t{min-width:0}
.card .t b{display:block;font-size:1.02rem;letter-spacing:-.01em}
.card .t span{display:block;font-size:.75rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{
  font-size:.74rem;font-weight:600;color:var(--chip-text);background:var(--chip);
  border-radius:99px;padding:5px 10px;
}
.chips a:active{opacity:.7}
.card .main:active .icon{transform:scale(.94)}
.icon{transition:transform .1s}

/* 카테고리 아이콘 배경색 */
.c1 .icon{background:#3d9df31f}
.c2 .icon{background:#f0433a1f}
.c3 .icon{background:#2fbd601f}
.c4 .icon{background:#8b5cf61f}
.c5 .icon{background:#f579161f}
.c6 .icon{background:#a2703d1f}
.c7 .icon{background:#4467d81f}
.c8 .icon{background:#64748b1f}
.c9 .icon{background:#e11d481f}
.c10 .icon{background:#0d94881f}

footer{margin-top:22px;text-align:center;font-size:.72rem;color:var(--sub)}
</style>
</head>
<body>

<header>
  <div class="date-row"><span id="today"></span><span id="clock"></span></div>
  <div id="greet"></div>
</header>

<form class="search" id="searchForm">
  <input id="q" type="search" placeholder="네이버 검색" autocomplete="off" enterkeyhint="search">
  <button type="submit">검색</button>
</form>

<div class="grid">

  <div class="card c1">
    <span class="num">1</span>
    <a class="main" href="https://weather.naver.com/" target="_blank" rel="noopener">
      <span class="icon">☀️</span>
      <span class="t"><b>날씨</b><span>오늘·주간 예보</span></span>
    </a>
    <div class="chips">
      <a href="https://weather.naver.com/air/" target="_blank" rel="noopener">미세먼지</a>
      <a href="https://m.search.naver.com/search.naver?query=%EC%A3%BC%EB%A7%90%20%EB%82%A0%EC%94%A8" target="_blank" rel="noopener">주말날씨</a>
    </div>
  </div>

  <div class="card c2">
    <span class="num">2</span>
    <a class="main" href="https://m.search.naver.com/search.naver?query=%EC%8B%A4%EC%8B%9C%EA%B0%84%20%EA%B5%90%ED%86%B5%EC%83%81%ED%99%A9" target="_blank" rel="noopener">
      <span class="icon">🚦</span>
      <span class="t"><b>실시간 교통</b><span>도로 정체 현황</span></span>
    </a>
    <div class="chips">
      <a href="https://m.search.naver.com/search.naver?query=%EA%B3%A0%EC%86%8D%EB%8F%84%EB%A1%9C%20%EA%B5%90%ED%86%B5%EC%83%81%ED%99%A9" target="_blank" rel="noopener">고속도로</a>
    </div>
  </div>

  <div class="card c3">
    <span class="num">3</span>
    <a class="main" href="https://map.naver.com/p/directions/-/-/-/car" target="_blank" rel="noopener">
      <span class="icon">🚗</span>
      <span class="t"><b>자동차 길찾기</b><span>네이버지도 운전</span></span>
    </a>
    <div class="chips">
      <a href="https://map.kakao.com/" target="_blank" rel="noopener">카카오맵</a>
      <a href="https://map.naver.com/p/directions/-/-/-/transit" target="_blank" rel="noopener">대중교통</a>
    </div>
  </div>

  <div class="card c4">
    <span class="num">4</span>
    <a class="main" href="https://calendar.google.com/" target="_blank" rel="noopener">
      <span class="icon">📅</span>
      <span class="t"><b>일정</b><span>구글 캘린더</span></span>
    </a>
    <div class="chips">
      <a href="https://calendar.naver.com/" target="_blank" rel="noopener">네이버 캘린더</a>
    </div>
  </div>

  <div class="card c5">
    <span class="num">5</span>
    <a class="main" href="https://map.naver.com/p/search/%EB%82%B4%EC%A3%BC%EB%B3%80%20%EB%A7%9B%EC%A7%91" target="_blank" rel="noopener">
      <span class="icon">🍽️</span>
      <span class="t"><b>맛집</b><span>내 주변 맛집 검색</span></span>
    </a>
    <div class="chips">
      <a href="https://m.search.naver.com/search.naver?query=%EC%98%A4%EB%8A%98%20%EC%A0%90%EC%8B%AC%20%EB%A9%94%EB%89%B4%20%EC%B6%94%EC%B2%9C" target="_blank" rel="noopener">메뉴 추천</a>
    </div>
  </div>

  <div class="card c6">
    <span class="num">6</span>
    <a class="main" href="https://map.naver.com/p/search/%EC%B9%B4%ED%8E%98" target="_blank" rel="noopener">
      <span class="icon">☕</span>
      <span class="t"><b>카페</b><span>내 주변 카페 검색</span></span>
    </a>
    <div class="chips">
      <a href="https://map.naver.com/p/search/%EB%94%94%EC%A0%80%ED%8A%B8%20%EC%B9%B4%ED%8E%98" target="_blank" rel="noopener">디저트</a>
    </div>
  </div>

  <div class="card c7">
    <span class="num">7</span>
    <a class="main" href="https://map.naver.com/p/search/%EC%A3%BC%EC%B0%A8%EC%9E%A5" target="_blank" rel="noopener">
      <span class="icon">🅿️</span>
      <span class="t"><b>주차</b><span>주변 주차장 검색</span></span>
    </a>
    <div class="chips">
      <a href="https://map.naver.com/p/search/%EA%B3%B5%EC%98%81%EC%A3%BC%EC%B0%A8%EC%9E%A5" target="_blank" rel="noopener">공영주차장</a>
    </div>
  </div>

  <div class="card c8">
    <span class="num">8</span>
    <a class="main" href="https://news.naver.com/" target="_blank" rel="noopener">
      <span class="icon">📰</span>
      <span class="t"><b>뉴스</b><span>네이버 뉴스홈</span></span>
    </a>
    <div class="chips">
      <a href="https://news.naver.com/section/101" target="_blank" rel="noopener">경제</a>
      <a href="https://news.naver.com/section/105" target="_blank" rel="noopener">IT</a>
    </div>
  </div>

  <div class="card c9">
    <span class="num">9</span>
    <a class="main" href="https://m.stock.naver.com/" target="_blank" rel="noopener">
      <span class="icon">📈</span>
      <span class="t"><b>주식·환율</b><span>네이버페이 증권</span></span>
    </a>
    <div class="chips">
      <a href="https://m.stock.naver.com/marketindex" target="_blank" rel="noopener">환율</a>
      <a href="https://netbell23.github.io/stocknews/" target="_blank" rel="noopener">내 주식뉴스</a>
    </div>
  </div>

  <div class="card c10">
    <span class="num">10</span>
    <a class="main" href="https://travel.naver.com/" target="_blank" rel="noopener">
      <span class="icon">⛰️</span>
      <span class="t"><b>여행·운동</b><span>네이버 여행</span></span>
    </a>
    <div class="chips">
      <a href="https://netbell23.github.io/stocknews/hiking-app/" target="_blank" rel="noopener">두마음 산악회</a>
      <a href="https://m.search.naver.com/search.naver?query=%EA%B3%A8%ED%94%84%EC%9E%A5%20%EC%98%88%EC%95%BD" target="_blank" rel="noopener">골프</a>
    </div>
  </div>

</div>

<footer>홈 화면에 추가하면 앱처럼 쓸 수 있어요</footer>

<script>
const DAYS = ['일','월','화','수','목','금','토'];

function tick(){
  const now = new Date();
  document.getElementById('today').textContent =
    `${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS[now.getDay()]})`;
  const h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;

  let g;
  if (h < 5)       g = '늦은 밤이에요 🌙';
  else if (h < 11) g = '좋은 아침입니다 ☀️';
  else if (h < 14) g = '점심 맛있게 드세요 🍚';
  else if (h < 18) g = '활기찬 오후 보내세요 💪';
  else if (h < 22) g = '편안한 저녁입니다 🌆';
  else             g = '오늘도 수고하셨어요 🌙';
  // 주말이면 인사말 교체
  if (now.getDay() === 0 || now.getDay() === 6) g = '즐거운 주말 보내세요 🏞️';
  document.getElementById('greet').textContent = g;
}
tick();
setInterval(tick, 30 * 1000);

document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  window.open('https://m.search.naver.com/search.naver?query=' + encodeURIComponent(q), '_blank');
});
</script>
</body>
</html>
