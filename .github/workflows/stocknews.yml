name: StockNews

on:
  schedule:
    # 페이지 갱신(카톡 X). 시간은 UTC, KST = UTC + 9. GitHub cron 은 지연될 수 있음.
    - cron: "0 0 * * 1-5"        # 장 시작 페이지 갱신: KST 09:00, 월~금
    - cron: "50 6 * * 1-5"       # 장 마감 페이지 갱신: KST 15:50, 월~금
  repository_dispatch:           # 외부 cron(cron-job.org 등)이 정시에 호출 → 아침 카톡 전송
    types: [morning-kakao]
  workflow_dispatch:             # 수동 실행(테스트)

# Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 방지 (이전 실행 취소하지 않고 큐잉)
concurrency:
  group: stocknews-pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # 외부 호출(repository_dispatch) 또는 수동 실행일 때만 카톡 전송(=1).
      # schedule(페이지 갱신)은 전송 안 함(=0).
      STOCKNEWS_SEND: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build pages (and send Kakao on morning run)
        run: python stock_alert.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
